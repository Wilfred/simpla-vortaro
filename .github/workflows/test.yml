name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Django 1.8 supports Python up to 3.5, which setup-python no longer
    # provides on current runners.
    container: python:3.5
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements_pinned.txt
      - run: python manage.py test --with-coverage --cover-package=vortaro
